        <ul>
          <li><a href="https://github.com/mr-taha-saqib/SiteLine-AI-Receptionist">SiteLine AI Receptionist</a>: 24/7 inbound voice agent for US construction and inspection businesses. Real-time Twilio ConversationRelay calls run a Claude tool-use loop that quotes from a pricing table, books into Google Calendar, logs every lead to Google Sheets, texts confirmations, shares Calendly overflow links and transfers to a human on request. AI disclosure and a recording notice are built into every greeting, at roughly one second voice-to-voice.</li>
          <li><a href="https://github.com/mr-taha-saqib/Autonomous-AI-Sales-Caller-CRM">Autonomous AI Sales Caller &amp; CRM</a>: AI cold-calling platform with a built-in CRM. Twilio Voice calls powered by the Claude API qualify leads, handle objections, book appointments and write every outcome back to PostgreSQL. FastAPI backend with SQLAlchemy and Alembic, JWT authentication with role-based access, a Next.js and TypeScript dashboard, Docker Compose and Nginx deployment, and pytest and Playwright tests.</li>
          <li><a href="https://github.com/mr-taha-saqib/ai-powered-legal-contract-review-risk-analysis-assistant">AI Contract Review Assistant</a>: Upload a PDF, DOCX or TXT contract (up to 10 MB) and get liability, termination, confidentiality and payment clauses flagged with Low, Medium or High risk and explained in plain language. Context-aware Q&amp;A keeps chat history per contract, sensitive questions get extra disclaimers, and results export as a PDF report. Next.js, TypeScript, Prisma and OpenAI GPT-4o.</li>
          <li><a href="https://github.com/mr-taha-saqib/CHARM-Chicken-Health-Assessment-and-Remote-Monitoring">CHARM</a>: Computer-vision platform that detects and diagnoses poultry disease from images and video. YOLOv8 detects chickens, BoT-SORT tracks individual birds and ResNet50 classifies infectious coryza, fowl cholera and fowl pox. The Django web app adds secure login, diagnostic history, health alerts with treatment suggestions and an admin dashboard. University project, team of three.</li>
          <li><a href="https://github.com/mr-taha-saqib/Micro-RAG-over-an-RDF-Knowledge-Graph">Micro-RAG over a Knowledge Graph</a>: Retrieval-augmented QA built from scratch: a TF-IDF retriever over RDF triples feeds a compact encoder-decoder Transformer in PyTorch (256-dim, 3+3 layers, 8 heads, no pretrained weights). Four tasks (text to triples, triples to text, grounded QA and a triple consistency check) share one trunk and train in a single backward pass. No LangChain and no hosted LLM.</li>
          <li><a href="https://github.com/mr-taha-saqib/german-sme-bank-transaction-classification">German SME Transaction Classification</a>: Leakage-safe reproduction of a published SME transaction-categorization pipeline for German text and 37 classes. GermanFinBERT reached 0.649 ± 0.027 accuracy against 0.612 ± 0.025 for FinBERT over five seeds, with calibrated routing to manual review. Reliability diagrams compare model confidence before and after calibration.</li>
          <li><a href="https://github.com/mr-taha-saqib/SVD-Based-Collaborative-Filtering">SVD Collaborative Filtering</a>: Recommender system on MovieLens 100K and 1M. Truncated SVD at k=10 reaches an RMSE of 0.8812 against 1.0447 for a global-mean baseline; SGD matrix factorization reaches 0.8710. Plots cover singular-value decay, explained variance, RMSE and MAE against rank, baseline comparison and a cross-dataset check.</li>
          <li><a href="https://github.com/mr-taha-saqib/Respiratory-Waveform-Prediction-using-BiLSTM-with-Attention">Respiratory Waveform Forecasting</a>: BiLSTM with Bahdanau attention that forecasts 15 seconds of the nasal-pressure waveform from 20 seconds of physiological signal in EDF files. The pipeline filters, normalizes and resamples to 32 Hz, extracts breathing frequency, runs sliding-window inference on GPU or CPU and exports predictions to CSV and EDF.</li>
          <li><a href="https://github.com/mr-taha-saqib/SentimentFusion">SentimentFusion</a>: Flask sentiment dashboard with four models (Logistic Regression, SVM, Naive Bayes and Random Forest) trained on 200,000+ Twitter and Reddit posts. The best model, an SVM, reaches 80.52% accuracy. Shows confidence scores, flags likely sarcasm with a context-aware detector and analyzes batches of Bluesky posts.</li>
          <li><a href="https://github.com/mr-taha-saqib/Vision-Model-Quantization-Inference-Benchmarking-FP16-vs-INT8-">Vision Model Quantization Benchmark</a>: Benchmarks FP16 against INT8 inference for a vision model, measuring latency, throughput and peak GPU memory across multiple runs. INT8 lowered memory use and improved latency and throughput, while FP16 kept higher numerical precision.</li>
          <li><a href="https://github.com/mr-taha-saqib/Transformer-TimeSeries-Forecasting">Transformer Time-Series Forecasting</a>: Compares autoregressive and non-autoregressive Transformer forecasters with distributional modeling, evaluated with NRMSE and CRPS. The notebook covers preprocessing and windowing, training with hyperparameter tuning, and forecast plots against actual values.</li>
          <li><a href="https://github.com/mr-taha-saqib/SEC-Filing-Connector">SEC Filing Connector</a>: Typed Python library and CLI for SEC EDGAR filings: ticker-to-CIK lookup, filtering by form type and date range, and filing download. The CLI prints a table or JSON and can save the first matching filing to a file. Pydantic v2 models, an httpx client and 35 passing tests.</li>
